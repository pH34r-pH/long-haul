name: Repository governance profile

description: Validate a repository's authority, data-use, evidence, and promotion profile.

inputs:
  profile-path:
    description: Repository-relative path to the governance profile JSON.
    required: false
    default: governance/repository-profile.json

runs:
  using: composite
  steps:
    - name: Validate repository governance profile
      shell: bash
      env:
        GOVERNANCE_PROFILE_PATH: ${{ inputs.profile-path }}
      run: python3 "$GITHUB_ACTION_PATH/validate.py" "$GOVERNANCE_PROFILE_PATH"
