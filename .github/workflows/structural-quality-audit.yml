name: Structural quality audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Native + Lizard + jscpd
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install lightweight audit tools
        run: python -m pip install --disable-pip-version-check "ruff==0.16.9" "lizard==1.24.0"

      - name: Native Python structural lint (audit only)
        shell: bash
        run: |
          set +e
          mkdir -p quality-audit
          ruff check . \
            --select C901,PLR0912,PLR0913,PLR0915 \
            --config "lint.mccabe.max-complexity=15" \
            --config "lint.pylint.max-args=7" \
            --output-format concise > quality-audit/ruff-structural.txt 2>&1
          status=$?
          cat quality-audit/ruff-structural.txt
          echo "ruff_status=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Lizard structural metrics (audit only)
        shell: bash
        run: |
          set +e
          lizard . -C 15 -L 75 -a 7 -w \
            -x "./.git/*" -x "./.venv/*" -x "./node_modules/*" \
            -x "./artifacts/*" -x "./dist/*" -x "./build/*" \
            > quality-audit/lizard.txt 2>&1
          status=$?
          cat quality-audit/lizard.txt
          {
            echo
            echo "lizard_status=$status"
            echo
            echo "### Largest source files (physical lines; audit only)"
            echo '~~~'
            find . -type f \
              \( -name '*.py' -o -name '*.js' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.ts' -o -name '*.tsx' -o -name '*.rs' -o -name '*.sh' \) \
              -not -path './.git/*' -not -path './.venv/*' -not -path './node_modules/*' \
              -not -path './artifacts/*' -not -path './dist/*' -not -path './build/*' \
              -print0 | xargs -0 -r wc -l | sort -nr | head -41
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Copy/paste duplication audit (audit only)
        shell: bash
        run: |
          set +e
          npx --yes jscpd@5.0.12 . \
            --min-lines 8 \
            --min-tokens 60 \
            --format python,javascript,typescript,rust \
            --ignore "**/.git/**,**/.venv/**,**/node_modules/**,**/artifacts/**,**/dist/**,**/build/**,**/*-lock.json" \
            --reporters console,json \
            --output quality-audit/jscpd \
            > quality-audit/jscpd-console.txt 2>&1
          status=$?
          cat quality-audit/jscpd-console.txt
          echo "jscpd_status=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Enforce no structural regression
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/quality-base"
          git worktree add --detach "$base_dir" "$BASE_SHA"
          mkdir -p quality-audit/base

          (
            cd "$base_dir"
            set +e
            ruff check . \
              --select C901,PLR0912,PLR0913,PLR0915 \
              --config "lint.mccabe.max-complexity=15" \
              --config "lint.pylint.max-args=7" \
              --output-format concise > "$GITHUB_WORKSPACE/quality-audit/base/ruff.txt" 2>&1
            lizard . -C 15 -L 75 -a 7 -w \
              -x "./.git/*" -x "./.venv/*" -x "./node_modules/*" \
              -x "./artifacts/*" -x "./dist/*" -x "./build/*" \
              > "$GITHUB_WORKSPACE/quality-audit/base/lizard.txt" 2>&1
            npx --yes jscpd@5.0.12 . \
              --min-lines 8 --min-tokens 60 \
              --format python,javascript,typescript,rust \
              --ignore "**/.git/**,**/.venv/**,**/node_modules/**,**/artifacts/**,**/dist/**,**/build/**,**/*-lock.json" \
              --reporters console \
              > "$GITHUB_WORKSPACE/quality-audit/base/jscpd.txt" 2>&1
            true
          )

          count_ruff() { grep -Eo 'Found [0-9]+ errors?\.' "$1" | tail -1 | grep -Eo '[0-9]+' || echo 0; }
          count_lizard() { grep -c 'warning: .* NLOC,' "$1" || true; }
          count_clones() { grep -Eo 'Found [0-9]+ clones?\.' "$1" | tail -1 | grep -Eo '[0-9]+' || echo 0; }

          head_ruff="$(count_ruff quality-audit/ruff-structural.txt)"
          base_ruff="$(count_ruff quality-audit/base/ruff.txt)"
          head_lizard="$(count_lizard quality-audit/lizard.txt)"
          base_lizard="$(count_lizard quality-audit/base/lizard.txt)"
          head_clones="$(count_clones quality-audit/jscpd-console.txt)"
          base_clones="$(count_clones quality-audit/base/jscpd.txt)"

          {
            echo
            echo "### Quality ratchet"
            echo "| Signal | Base | Head |"
            echo "| --- | ---: | ---: |"
            echo "| Native Ruff structural findings | $base_ruff | $head_ruff |"
            echo "| Lizard structural findings | $base_lizard | $head_lizard |"
            echo "| jscpd clone blocks | $base_clones | $head_clones |"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$head_ruff" -le "$base_ruff" || { echo "::error::Ruff structural findings increased: $base_ruff -> $head_ruff"; exit 1; }
          test "$head_lizard" -le "$base_lizard" || { echo "::error::Lizard structural findings increased: $base_lizard -> $head_lizard"; exit 1; }
          test "$head_clones" -le "$base_clones" || { echo "::error::Duplication clone blocks increased: $base_clones -> $head_clones"; exit 1; }

      - name: Summarize audit policy
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "### Structural quality audit"
            echo
            echo "- Existing findings are grandfathered; pull requests may not increase structural findings or clone blocks."
            echo "- Function length: 75 logical lines (Lizard)"
            echo "- Cyclomatic complexity: 15 (Lizard + Ruff C901)"
            echo "- Parameters: 7 (Lizard + Ruff PLR0913)"
            echo "- Native Python signals: branches, arguments, statements, complexity"
            echo "- Duplication: jscpd, minimum 8 lines / 60 tokens"
            echo "- Proposed later file ceiling: 500 physical lines; current largest files are reported above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-quality-audit-${{ github.sha }}
          path: quality-audit/
          if-no-files-found: warn
          retention-days: 14
