name: Azure IaC validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - uses: azure/CLI@v2
        with:
          azcliversion: 2.65.0
          inlineScript: |
            set -euo pipefail
            az bicep install
            export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
            az bicep build --file infra/azure/main.bicep --outfile /tmp/long-haul-reference.json
            jq -e \
              '.asserts.targetResourceGroupIsExpected == "[equals(resourceGroup().name, parameters('"'"'expectedResourceGroupName'"'"'))]"' \
              /tmp/long-haul-reference.json
            az bicep build --file infra/azure/mcp/main.bicep --outfile /tmp/long-haul-mcp.json
            jq -e '.resources | length >= 3' /tmp/long-haul-mcp.json
            az bicep build --file infra/azure/mcp/deploy-package.bicep --outfile /tmp/long-haul-mcp-package.json
            jq -e '.resources | any(.type == "Microsoft.Web/sites/extensions" and .name == "[format('"'"'{0}/onedeploy'"'"', parameters('"'"'functionAppName'"'"'))]")' /tmp/long-haul-mcp-package.json
      - name: Check public IaC safety
        run: bash infra/azure/scripts/static-check.sh
