name: Azure IaC validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - uses: azure/CLI@v2
        with:
          azcliversion: 2.65.0
          inlineScript: |
            az bicep install
            az bicep build --file infra/azure/main.bicep
      - name: Reject unsafe reference defaults and committed credential material
        run: |
          test "$(rg -n 'Standard_(N|NC|ND|NV|H)\w*' infra/azure .github/workflows --glob '!azure-validate.yml' || true)" = ''
          test "$(rg -n 'client[_-]?secret|AZURE_CLIENT[_]SECRET|BEGIN (RSA|OPENSSH) PRIVATE KEY' infra/azure .github/workflows --glob '!azure-validate.yml' || true)" = ''
          test "$(rg -n 'osDiskSizeGb.*(1[0-9]{2}|[2-9][0-9]{2})' infra/azure || true)" = ''
