name: Azure reference destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DESTROY-LONG-HAUL-REFERENCE to remove only the IaC-managed reference vessel resources.'
        required: true
        type: string
      location:
        description: 'Reference vessel region.'
        required: true
        default: westus2

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DESTROY-LONG-HAUL-REFERENCE'
    runs-on: ubuntu-latest
    environment: azure-reference
    env:
      TARGET_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify protected target
        env:
          EXPECTED_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          test -n "$TARGET_RESOURCE_GROUP"
          test "$(az account show --query id --output tsv)" = "$EXPECTED_SUBSCRIPTION"
          test "$(az group show --name "$TARGET_RESOURCE_GROUP" --query name --output tsv)" = "$TARGET_RESOURCE_GROUP"
          test "$TARGET_RESOURCE_GROUP" = 'rg-long-haul-reference'
      - name: Preview IaC-managed deletions
        run: |
          set -euo pipefail
          echo 'The following Long Haul reference resources are eligible for deletion:'
          az resource list --resource-group "$TARGET_RESOURCE_GROUP" --tag project=long-haul --query "[?tags.purpose=='reference-vessel'].{name:name,type:type,location:location}" --output table
      - name: Delete only named reference-vessel resources
        run: |
          set -euo pipefail
          for id in $(az resource list --resource-group "$TARGET_RESOURCE_GROUP" --tag project=long-haul --query "[?tags.purpose=='reference-vessel'].id" --output tsv); do
            az resource delete --ids "$id"
          done
