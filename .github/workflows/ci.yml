name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e '.[dev]'
      - run: python -m ruff check src tests
      - name: Test Python 3.11 compatibility
        run: python -m pytest -q
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Python 3.12 test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test Python 3.12 package target
        run: python -m pytest -q


  mutation:
    name: Mutation pilot (scheduler core)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install test and mutation dependencies
        run: python -m pip install -e '.[dev,mutation]'
      - name: Mutate deterministic scheduler logic
        run: |
          irradiate run src/long_haul/scheduler/core.py \
            --report json --output "$RUNNER_TEMP/mutation-report.json" \
            --verify-survivors --workers 2
      - name: Retain Mutation Testing Elements report
        uses: actions/upload-artifact@v4
        with:
          name: long-haul-mutation-report-${{ github.sha }}
          path: ${{ runner.temp }}/mutation-report.json
          if-no-files-found: error
          retention-days: 30

  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build and verify offline Long Haul package
        run: python3 scripts/build_offline_package.py --output-dir "$RUNNER_TEMP/longhaul-offline-package"
      - name: Publish checked package bytes
        uses: actions/upload-artifact@v4
        with:
          name: longhaul-offline-package-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/longhaul-offline-package/
          if-no-files-found: error
          retention-days: 30
