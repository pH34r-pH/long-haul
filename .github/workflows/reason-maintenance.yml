name: Experimental reason maintenance
on:
  push:
    paths:
      - 'src/long_haul/reason_maintenance/**'
      - 'tests/test_reason_maintenance.py'
      - 'tests/fixtures/reason_maintenance/**'
      - '.github/workflows/reason-maintenance.yml'
  pull_request:
    paths:
      - 'src/long_haul/reason_maintenance/**'
      - 'tests/test_reason_maintenance.py'
      - 'tests/fixtures/reason_maintenance/**'
      - '.github/workflows/reason-maintenance.yml'
permissions:
  contents: read
jobs:
  clips-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Standalone optional experiment: no shared dependency manifest changes.
      - run: python -m pip install -e '.[dev]' 'clipspy==1.0.6'
      - run: python -m ruff check src/long_haul/reason_maintenance tests/test_reason_maintenance.py
      - name: Require exact backend and run normative corpus/restart checks
        env:
          LONG_HAUL_REQUIRE_CLIPS: '1'
        run: python -m pytest -q tests/test_reason_maintenance.py
