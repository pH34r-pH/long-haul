name: Prototype / devenv runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'devenv.nix'
      - 'devenv.yaml'
      - 'devenv.lock'
      - '.github/workflows/prototype-devenv.yml'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  cpu-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Exercise Python + nixpkgs llama.cpp environment
        run: devenv test
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - name: Resolve the first standard uv lock for review
        run: |
          set -euo pipefail
          uv lock --python 3.12
          echo '---BEGIN-UV-LOCK---'
          cat uv.lock
          echo '---END-UV-LOCK---'
          sha256sum uv.lock
