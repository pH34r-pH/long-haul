name: Prototype / devenv runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'devenv.nix'
      - 'devenv.yaml'
      - 'devenv.lock'
      - 'uv.lock'
      - '.github/workflows/prototype-devenv.yml'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: prototype-devenv-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Resolve standard devenv inputs for review
        run: |
          set -euo pipefail
          devenv update
          echo '---BEGIN-DEVENV-LOCK---'
          cat devenv.lock
          echo '---END-DEVENV-LOCK---'
      - name: Exercise locked Python + nixpkgs llama.cpp environment
        run: devenv test
      - name: Build the standard uv2nix Python output
        run: devenv build outputs.long-haul
