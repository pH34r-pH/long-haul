name: Azure reference operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform on the reference vessel.'
        required: true
        type: choice
        default: reference-status
        options:
          - status
          - bootstrap-diagnostics
          - pi-upstream-qualification
          - start-reference
          - reference-status
          - reference-log
          - show-reference-report
          - stop-reference
          - start
          - restart
          - deallocate
      location:
        description: 'Reference vessel region.'
        required: true
        default: westus2

permissions:
  contents: read
  id-token: write

jobs:
  operate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-reference
    env:
      VM_NAME: longhaul-reference-vm
      TARGET_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify protected target
        env:
          EXPECTED_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          test -n "$TARGET_RESOURCE_GROUP"
          test "$(az account show --query id --output tsv)" = "$EXPECTED_SUBSCRIPTION"
          test "$(az group show --name "$TARGET_RESOURCE_GROUP" --query name --output tsv)" = "$TARGET_RESOURCE_GROUP"
          test "$(az vm show --resource-group "$TARGET_RESOURCE_GROUP" --name "$VM_NAME" --query location --output tsv)" = '${{ inputs.location }}'
          test "$(az vm show --resource-group "$TARGET_RESOURCE_GROUP" --name "$VM_NAME" --query tags.project --output tsv)" = 'long-haul'
          test "$(az vm show --resource-group "$TARGET_RESOURCE_GROUP" --name "$VM_NAME" --query tags.purpose --output tsv)" = 'reference-vessel'
      - name: Vessel status
        if: inputs.operation == 'status'
        run: |
          set -euo pipefail
          az vm get-instance-view --resource-group "$TARGET_RESOURCE_GROUP" --name "$VM_NAME" \
            --query '{name:name,location:location,powerState:instanceView.statuses[?starts_with(code, `PowerState/`)]|[0].displayStatus,provisioningState:provisioningState,vmAgent:instanceView.vmAgent.statuses[0].displayStatus}' --output yaml
      - name: Bootstrap diagnostics
        if: inputs.operation == 'bootstrap-diagnostics'
        run: |
          set -euo pipefail
          az vm run-command invoke --resource-group "$TARGET_RESOURCE_GROUP" --name "$VM_NAME" --command-id RunShellScript --scripts '
            echo "=== cloud-init ==="; cloud-init status --long || true
            echo "=== swap ==="; swapon --show || true; free -h || true
            echo "=== expected paths ==="; ls -ld /opt/long-haul /opt/llama.cpp /opt/models /opt/long-haul/run-reference 2>&1 || true
            echo "=== llama-cli ==="; find /opt/llama.cpp -maxdepth 3 -type f -name llama-cli -ls 2>/dev/null || true
            echo "=== models ==="; find /opt/models -maxdepth 2 -type f -printf "%p %s bytes\n" 2>/dev/null || true
            echo "=== cloud-init tail ==="; tail -n 80 /var/log/cloud-init-output.log 2>/dev/null || true
          ' --output json
      - name: Qualify pinned upstream Pi on reference vessel
        if: inputs.operation == 'pi-upstream-qualification'
        run: |
          set -euo pipefail
          az vm run-command invoke --resource-group "$TARGET_RESOURCE_GROUP" --name "$VM_NAME" --command-id RunShellScript --scripts '
            set -euo pipefail
            root=/opt/long-haul/pi-qualification
            rm -rf "$root"
            mkdir -p "$root"
            git clone --filter=blob:none https://github.com/earendil-works/pi.git "$root/pi"
            git -C "$root/pi" checkout --detach e40126f578ccc0a4a21f8d30cd8e96c8ecfe1722
            test "$(python3 -c "import json; print(json.load(open(\"$root/pi/packages/coding-agent/package.json\"))[\"version\"])")" = "0.87.0"
            echo "Pinned Pi source prepared at $root/pi"

            node_version=v22.19.0
            node_arch=x64
            node_archive="node-${node_version}-linux-${node_arch}.tar.xz"
            node_url="https://nodejs.org/dist/${node_version}/${node_archive}"
            node_sha256="__NODE_SHA256__"
            curl --fail --location --retry 3 --output "$root/$node_archive" "$node_url"
            printf "%s  %s\n" "$node_sha256" "$root/$node_archive" | sha256sum --check --strict
            tar -xJf "$root/$node_archive" -C "$root"
            node_root="$root/node-${node_version}-linux-${node_arch}"
            export PATH="$node_root/bin:$PATH"
            test "$(node --version)" = "$node_version"
            cd "$root/pi"
            npm ci --ignore-scripts
            npm run build --workspace=@earendil-works/pi-coding-agent

            npm run test --workspace=@earendil-works/pi-coding-agent -- --run \
              test/rpc-jsonl.test.ts \
              test/rpc-client-process-exit.test.ts \
              test/suite/regressions/2835-tools-allowlist-filters-extension-tools.test.ts

            echo "Pinned upstream Pi deterministic qualification passed."
          ' --output json
      - name: Start Long Haul reference experiment asynchronously
        if: inputs.operation == 'start-reference'
        run: |
          set -euo pipefail
          result=$(az vm run-command invoke --resource-group "$TARGET_RESOURCE_GROUP" --name "$VM_NAME" --command-id RunShellScript --scripts '
            set -eu
            if systemctl is-active --quiet long-haul-reference.service; then echo "reference already running"; exit 3; fi
            systemd-run --unit=long-haul-reference --property=WorkingDirectory=/opt/long-haul --property=StandardOutput=append:/var/log/long-haul-reference.log --property=StandardError=append:/var/log/long-haul-reference.log /bin/bash -lc "/opt/long-haul/run-reference"
            echo "reference launched"
          ' --output json)
          printf '%s\n' "$result"
      - name: Reference status
        if: inputs.operation == 'reference-status'
        run: |
          set -euo pipefail
          az vm run-command invoke --resource-group "$TARGET_RESOURCE_GROUP" --name "$VM_NAME" --command-id RunShellScript --scripts '
            echo "=== service ==="
            systemctl status long-haul-reference.service --no-pager -l 2>&1 || true
            echo "=== process ==="
            pgrep -af "run-reference|reference_runtime|llama-cli" || true
            echo "=== runs ==="
            find /opt/long-haul/runs -mindepth 1 -maxdepth 1 -type d -printf "%T@ %p\n" 2>/dev/null | sort -nr | sed -n "1,10p"
            latest=$(find /opt/long-haul/runs -mindepth 1 -maxdepth 1 -type d -printf "%T@ %p\n" 2>/dev/null | sort -nr | sed -n "1s/^[^ ]* //p")
            if [ -n "$latest" ]; then
              echo "=== latest: $latest ==="
              find "$latest" -maxdepth 2 -type f -printf "%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n" 2>/dev/null | sort
              if [ -f "$latest/reference-report.json" ]; then echo "=== report ==="; cat "$latest/reference-report.json"; fi
            fi
            echo "=== log tail ==="
            tail -n 100 /var/log/long-haul-reference.log 2>/dev/null || true
          ' --output json
      - name: Reference log
        if: inputs.operation == 'reference-log'
        run: |
          set -euo pipefail
          az vm run-command invoke --resource-group "$TARGET_RESOURCE_GROUP" --name "$VM_NAME" --command-id RunShellScript --scripts '
            echo "=== systemd journal ==="
            journalctl -u long-haul-reference.service --no-pager -n 200 2>&1 || true
            echo "=== retained log ==="
            tail -n 300 /var/log/long-haul-reference.log 2>/dev/null || true
          ' --output json
      - name: Show retained reference report
        if: inputs.operation == 'show-reference-report'
        run: |
          set -euo pipefail
          result=$(az vm run-command invoke --resource-group "$TARGET_RESOURCE_GROUP" --name "$VM_NAME" --command-id RunShellScript --scripts '
            latest=$(find /opt/long-haul/runs -mindepth 1 -maxdepth 1 -type d -printf "%T@ %p\n" 2>/dev/null | sort -nr | sed -n "1s/^[^ ]* //p")
            if [ -z "$latest" ]; then echo "No Long Haul run directories found"; exit 2; fi
            report="$latest/reference-report.json"
            echo "=== $report ==="
            if [ ! -f "$report" ]; then echo "No retained JSON report found in latest run"; exit 2; fi
            cat "$report"
          ' --output json)
          printf '%s\n' "$result"
          message=$(printf '%s' "$result" | jq -r '.value[0].message // ""')
          printf '%s\n' "$message" | grep -q 'reference-report.json'
      - name: Stop Long Haul reference experiment
        if: inputs.operation == 'stop-reference'
        run: |
          set -euo pipefail
          az vm run-command invoke --resource-group "$TARGET_RESOURCE_GROUP" --name "$VM_NAME" --command-id RunShellScript --scripts '
            systemctl stop long-haul-reference.service 2>/dev/null || true
            systemctl status long-haul-reference.service --no-pager -l 2>&1 || true
          ' --output json
      - name: Start vessel
        if: inputs.operation == 'start'
        run: az vm start --resource-group "$TARGET_RESOURCE_GROUP" --name "$VM_NAME" --no-wait
      - name: Restart vessel
        if: inputs.operation == 'restart'
        run: az vm restart --resource-group "$TARGET_RESOURCE_GROUP" --name "$VM_NAME" --no-wait
      - name: Deallocate vessel
        if: inputs.operation == 'deallocate'
        run: az vm deallocate --resource-group "$TARGET_RESOURCE_GROUP" --name "$VM_NAME" --no-wait
