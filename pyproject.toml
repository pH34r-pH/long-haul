[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "long-haul"
version = "0.1.0"
license = { text = "Apache-2.0" }
description = "Heterogeneous local inference crew and topology-aware scheduler"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
epistemic = ["rdflib>=7.1,<8", "PyLD>=2.0.4,<3", "pyshacl>=0.30,<0.31"]
dev = ["pytest>=8.0", "ruff>=0.6", "long-haul[epistemic]"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
"long_haul.epistemic" = ["shapes.ttl"]
